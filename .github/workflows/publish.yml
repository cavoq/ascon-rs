name: Publish to crates.io

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Verify tag matches the package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require v<package version>
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          expected = f"v{package['version']}"
          actual = os.environ["RELEASE_TAG"]
          if package["name"] != "ascon-rs" or actual != expected:
              raise SystemExit(f"Expected ascon-rs tag {expected!r}, got {actual!r}")
          print(f"Validated ascon-rs release {actual}")
          PY

  ci:
    name: Check the tagged commit
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ascon-rs
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify publication without uploading
        run: cargo publish --dry-run --locked -p ascon-rs --registry crates-io
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Set the repository Actions secret CARGO_REGISTRY_TOKEN to a crates.io API token with permission to publish ascon-rs."
            exit 1
          fi
          cargo publish --locked -p ascon-rs --registry crates-io
